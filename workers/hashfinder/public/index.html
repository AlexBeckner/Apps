<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="./favicon.png">
    <title>dataspeedhashfinder</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        background: #111;
        color: #eee;
        margin: 8px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;
        font-size: 14px;
      }

      main {
        max-width: 900px;
        margin: 0 auto;
      }

      .search-grid,
      .hash-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 48px minmax(0, 1fr);
        gap: 8px;
      }

      .branch-column {
        display: grid;
        gap: 4px;
        padding: 0;
      }

      .commit-meta {
        color: #aaa;
        font-size: 12px;
        min-height: 16px;
        overflow-wrap: anywhere;
      }

      .commit-meta.error {
        color: #ff4d4d;
      }

      .commit-meta a {
        color: #8ab4f8;
      }

      .ref-kind {
        text-transform: uppercase;
      }

      .params-flag {
        color: #f0c060;
      }

      p {
        margin: 0;
      }

      label {
        display: block;
        margin-bottom: 4px;
        font-weight: 600;
      }

      .sr-only {
        height: 1px;
        left: -10000px;
        overflow: hidden;
        position: absolute;
        top: auto;
        width: 1px;
      }

      input {
        background: #111;
        border: 1px solid #666;
        color: #eee;
        width: 100%;
        font: inherit;
        padding: 4px 6px;
      }

      input::placeholder {
        color: #888;
      }

      .rows {
        display: grid;
        gap: 8px;
        margin-top: 8px;
      }

      .module-name {
        grid-column: 1 / -1;
        font-weight: 700;
      }

      .hash-cell {
        min-height: 64px;
        padding: 4px 0;
      }

      .match-cell {
        align-items: center;
        display: flex;
        font-size: 28px;
        font-weight: 700;
        justify-content: center;
        min-height: 64px;
      }

      .match {
        color: #25d366;
      }

      .mismatch {
        color: #ff4d4d;
      }

      .hash {
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 20px;
        font-weight: 700;
      }

      .hash-line {
        align-items: center;
        display: flex;
        gap: 8px;
      }

      .placeholder,
      .error {
        color: #aaa;
        overflow-wrap: anywhere;
      }

      .error {
        color: #ff4d4d;
      }

      button {
        background: #2a2a2a;
        border: 1px solid #666;
        color: #eee;
        cursor: pointer;
        font: inherit;
        padding: 4px 8px;
      }

      .download-button {
        align-items: center;
        display: inline-flex;
        height: 28px;
        justify-content: center;
        padding: 0;
        width: 28px;
      }

      .download-button svg {
        height: 16px;
        width: 16px;
      }

      .status-section {
        margin-top: 8px;
        padding: 0;
      }

      @media (max-width: 700px) {
        .search-grid,
        .hash-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="search-grid" aria-label="Branch inputs">
        <div class="branch-column">
          <label class="sr-only" for="left-ref">Left branch</label>
          <input
            id="left-ref"
            autocomplete="off"
            list="branch-suggestions"
            placeholder="master"
            value="master"
          >
          <label class="sr-only" for="left-commit">Left commit</label>
          <input
            id="left-commit"
            autocomplete="off"
            list="left-commit-suggestions"
            placeholder="commit (default: branch head)"
          >
          <p id="left-commit-meta" class="commit-meta"></p>
          <datalist id="left-commit-suggestions"></datalist>
        </div>
        <div></div>
        <div class="branch-column">
          <label class="sr-only" for="right-ref">Right branch</label>
          <input
            id="right-ref"
            autocomplete="off"
            list="branch-suggestions"
            placeholder="branch, tag, or commit SHA"
          >
          <label class="sr-only" for="right-commit">Right commit</label>
          <input
            id="right-commit"
            autocomplete="off"
            list="right-commit-suggestions"
            placeholder="commit (default: branch head)"
          >
          <p id="right-commit-meta" class="commit-meta"></p>
          <datalist id="right-commit-suggestions"></datalist>
        </div>
      </section>

      <section id="rows" class="rows" aria-label="Dataspeed module hashes"></section>

      <section class="status-section" aria-live="polite">
        <p id="backend-status"></p>
      </section>

      <datalist id="branch-suggestions"></datalist>
    </main>

    <script src="./config.js"></script>
    <script>
      const appConfig = window.dataspeedHashFinderConfig || {};
      const proxyApiBaseUrl = (appConfig.apiBaseUrl || "").replace(/\/+$/, "");
      const files = [
        { module: "Gateway", fileName: "FORD_GE1 Gateway.json" },
        { module: "Shift", fileName: "FORD_GE1 Shift.json" },
        { module: "Throttle", fileName: "FORD_GE1 Throttle.json" },
      ];

      // GitHub ref URLs whose remainder is the ref itself, with no trailing
      // path segments to disambiguate: /tree/<ref>, /commits/<ref>,
      // /commit/<sha>.
      const REF_URL_MARKERS = ["/tree/", "/commits/", "/commit/"];
      const COMMIT_SHA_PATTERN = /^([0-9a-f]{7,40})(?=$|[\s·,])/i;
      const SHORT_SHA_LENGTH = 8;

      const columns = {
        left: createColumn("left"),
        right: createColumn("right"),
      };

      function createColumn(name) {
        return {
          input: document.querySelector(`#${name}-ref`),
          commitInput: document.querySelector(`#${name}-commit`),
          commitList: document.querySelector(`#${name}-commit-suggestions`),
          metaEl: document.querySelector(`#${name}-commit-meta`),
          files: new Map(),
          errors: new Map(),
          requestId: 0,
          commitSuggestionRequestId: 0,
          commitListBranch: null,
          commit: null,
          commitError: "",
          pinned: false,
          refResolved: false,
          loading: false,
        };
      }

      const rowsEl = document.querySelector("#rows");
      const branchSuggestions = document.querySelector("#branch-suggestions");
      const backendStatus = document.querySelector("#backend-status");

      let branchSuggestionRequestId = 0;

      renderBackendStatus();
      renderRows();

      function normalizeRef(input) {
        const trimmed = input.trim();
        return refFromUrl(trimmed) || trimmed.replace(/^origin\//, "");
      }

      function normalizeCommit(input) {
        const trimmed = input.trim();
        if (!trimmed) {
          return "";
        }

        // Accepts a bare SHA, a commit URL, or a picked suggestion label such
        // as "b67d9a6e · 2026-06-11 · Update FORD_GE1 Gateway".
        const candidate = refFromUrl(trimmed) || trimmed;
        const sha = candidate.match(COMMIT_SHA_PATTERN);
        return sha ? sha[1].toLowerCase() : candidate;
      }

      function refFromUrl(value) {
        for (const marker of REF_URL_MARKERS) {
          const index = value.indexOf(marker);
          if (index === -1) {
            continue;
          }

          const remainder = value
            .slice(index + marker.length)
            .split(/[?#]/)[0]
            .replace(/\/+$/, "");
          if (remainder) {
            return decodeURIComponent(remainder);
          }
        }

        return "";
      }

      function columnRef(column) {
        return (
          normalizeCommit(column.commitInput.value) ||
          normalizeRef(column.input.value)
        );
      }

      function renderBackendStatus() {
        if (proxyApiBaseUrl) {
          return;
        }

        backendStatus.className = "error";
        backendStatus.textContent =
          "Backend proxy is not configured. Set apiBaseUrl in config.js.";
      }

      function proxyApiUrl(path, params) {
        if (!proxyApiBaseUrl) {
          throw new Error("Backend proxy is not configured.");
        }

        const url = new URL(path, `${proxyApiBaseUrl}/`);
        Object.entries(params).forEach(([key, value]) => {
          url.searchParams.set(key, value);
        });
        return url.toString();
      }

      async function fetchProxyJson(path, params) {
        const response = await fetch(proxyApiUrl(path, params));
        const responseText = await response.text();
        let data;
        try {
          data = JSON.parse(responseText);
        } catch {
          data = {};
        }

        if (!response.ok) {
          const error = new Error(
            data.error ||
              `${response.status} ${response.statusText}: ${responseText}`
          );
          error.status = response.status;
          throw error;
        }

        return data;
      }

      function friendlyLoadError(error, context = {}) {
        const message = error?.message || "";
        if (isRefNotFoundError(error, message)) {
          if (context.refResolved) {
            return "Not present at this commit.";
          }

          return refNotFoundMessage(context);
        }

        const fallback = context.pinned
          ? "Unable to load commit."
          : "Unable to load branch.";
        if (message.length > 180) {
          return fallback;
        }

        return message || fallback;
      }

      // core-stack has enough objects that GitHub refuses to resolve very short
      // SHA prefixes, including the 7 characters git log prints by default.
      function refNotFoundMessage(context) {
        if (!context.pinned) {
          return "Branch not found.";
        }

        const ref = context.ref || "";
        if (/^[0-9a-f]+$/i.test(ref) && ref.length < SHORT_SHA_LENGTH) {
          return `Commit not found. Use at least ${SHORT_SHA_LENGTH} characters of the SHA.`;
        }

        return "Commit not found.";
      }

      function isRefNotFoundError(error, message) {
        if (error?.status === 404 || error?.status === 422) {
          return true;
        }

        const normalized = message.toLowerCase();
        if (
          /\b(no commit found|branch not found|not found)\b/i.test(message) ||
          normalized.includes("reference does not exist") ||
          normalized.includes("could not resolve") ||
          normalized.includes("invalid object name")
        ) {
          return true;
        }

        return error?.status === 500 && message.length > 500;
      }

      function downloadText(fileName, text) {
        const blob = new Blob([text], {
          type: "application/json;charset=utf-8",
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      function downloadFileName(parameterFile) {
        return parameterFile.fileName.replace(
          /\.json$/i,
          ` ${parameterFile.hash}.json`
        );
      }

      async function fetchParameterFile(ref, file) {
        const parameterFile = await fetchProxyJson("parameter-file", {
          ref,
          file: file.fileName,
        });

        return {
          module: parameterFile.module || file.module,
          fileName: parameterFile.fileName || file.fileName,
          hash: parameterFile.hash,
          text: parameterFile.text,
        };
      }

      function renderRows() {
        rowsEl.innerHTML = "";

        for (const file of files) {
          const row = document.createElement("div");
          row.className = "hash-row";

          const module = document.createElement("div");
          module.className = "module-name";
          module.textContent = file.module;

          row.append(
            module,
            renderCell(columns.left, file.module),
            renderMatchCell(file.module),
            renderCell(columns.right, file.module)
          );
          rowsEl.appendChild(row);
        }
      }

      function renderMatchCell(module) {
        const cell = document.createElement("div");
        cell.className = "match-cell";

        const leftFile = columns.left.files.get(module);
        const rightFile = columns.right.files.get(module);
        if (!leftFile || !rightFile) {
          return cell;
        }

        const marker = document.createElement("span");
        if (leftFile.hash === rightFile.hash) {
          marker.className = "match";
          marker.textContent = "=";
        } else {
          marker.className = "mismatch";
          marker.textContent = "X";
        }
        cell.appendChild(marker);

        return cell;
      }

      function renderCell(column, module) {
        const cell = document.createElement("article");
        cell.className = "hash-cell";
        const parameterFile = column.files.get(module);
        const error = column.errors.get(module);

        if (parameterFile) {
          const hashLine = document.createElement("div");
          hashLine.className = "hash-line";

          const hash = document.createElement("div");
          hash.className = "hash";
          hash.textContent = parameterFile.hash;

          const downloadButton = document.createElement("button");
          downloadButton.className = "download-button";
          downloadButton.type = "button";
          downloadButton.title = `Download ${parameterFile.fileName}`;
          downloadButton.setAttribute(
            "aria-label",
            `Download ${parameterFile.fileName}`
          );
          downloadButton.innerHTML =
            '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4h2v9l3-3 1.4 1.4L12 16.8l-5.4-5.4L8 10l3 3V4z" fill="currentColor"></path><path d="M5 19h14v2H5v-2z" fill="currentColor"></path></svg>';
          downloadButton.addEventListener("click", () => {
            downloadText(downloadFileName(parameterFile), parameterFile.text);
          });

          hashLine.append(hash, downloadButton);
          cell.appendChild(hashLine);
        } else if (error) {
          const message = document.createElement("p");
          message.className = "error";
          message.textContent = error;
          cell.appendChild(message);
        } else if (column.commitError) {
          // The ref itself did not resolve; the meta line already says why.
          const dash = document.createElement("p");
          dash.className = "placeholder";
          dash.textContent = "—";
          cell.appendChild(dash);
        } else {
          const placeholder = document.createElement("p");
          placeholder.className = "placeholder";
          placeholder.textContent = columnRef(column)
            ? "Loading..."
            : "Enter a branch";
          cell.appendChild(placeholder);
        }

        return cell;
      }

      async function fetchAllFiles(ref) {
        const results = await Promise.allSettled(
          files.map((file) => fetchParameterFile(ref, file))
        );

        return results.map((result, index) => ({
          file: files[index],
          result,
        }));
      }

      async function updateBranchSuggestions(input) {
        try {
          const requestId = branchSuggestionRequestId + 1;
          branchSuggestionRequestId = requestId;
          const prefix = normalizeRef(input.value);
          if (!prefix || prefix.length < 2) {
            branchSuggestions.innerHTML = "";
            return;
          }

          const data = await fetchProxyJson("branch-suggestions", { prefix });
          if (requestId !== branchSuggestionRequestId) {
            return;
          }

          branchSuggestions.innerHTML = "";
          (data.suggestions || []).forEach((suggestion) => {
            const option = document.createElement("option");
            option.value = suggestion;
            branchSuggestions.appendChild(option);
          });
        } catch {
          branchSuggestions.innerHTML = "";
        }
      }

      async function updateCommitSuggestions(columnName) {
        const column = columns[columnName];
        const branch = normalizeRef(column.input.value);
        const requestId = column.commitSuggestionRequestId + 1;
        column.commitSuggestionRequestId = requestId;
        column.commitListBranch = branch;

        if (!branch) {
          column.commitList.innerHTML = "";
          return;
        }

        try {
          const data = await fetchProxyJson("commit-suggestions", {
            ref: branch,
          });
          if (requestId !== column.commitSuggestionRequestId) {
            return;
          }

          column.commitList.innerHTML = "";
          (data.commits || []).forEach((commit) => {
            const option = document.createElement("option");
            option.value = commit.sha;
            option.label = commitOptionLabel(commit);
            column.commitList.appendChild(option);
          });
        } catch {
          if (requestId === column.commitSuggestionRequestId) {
            column.commitList.innerHTML = "";
            column.commitListBranch = null;
          }
        }
      }

      function commitOptionLabel(commit) {
        return [
          commit.shortSha,
          formatCommitDate(commit.date),
          commit.changesParameters
            ? `[params] ${commit.subject}`
            : commit.subject,
        ]
          .filter(Boolean)
          .join(" · ");
      }

      function formatCommitDate(date) {
        return String(date || "").slice(0, 10);
      }

      function renderCommitMeta(columnName) {
        const column = columns[columnName];
        const meta = column.metaEl;
        meta.className = "commit-meta";
        meta.textContent = "";

        if (column.commitError) {
          meta.className = "commit-meta error";
          meta.textContent = column.commitError;
          return;
        }

        if (!column.commit) {
          meta.textContent = column.loading ? "Resolving commit..." : "";
          return;
        }

        const kind = document.createElement("span");
        kind.className = "ref-kind";
        kind.textContent = column.pinned ? "pinned" : "head";

        const link = document.createElement("a");
        link.href = column.commit.htmlUrl;
        link.target = "_blank";
        link.rel = "noreferrer";
        link.textContent = column.commit.shortSha;

        meta.append(kind, document.createTextNode(" · "), link);

        const date = formatCommitDate(column.commit.date);
        if (date) {
          meta.append(document.createTextNode(` · ${date}`));
        }

        if (column.commit.changesParameters) {
          const flag = document.createElement("span");
          flag.className = "params-flag";
          flag.textContent = "[params]";
          meta.append(document.createTextNode(" · "), flag);
        }

        if (column.commit.subject) {
          meta.append(document.createTextNode(` · ${column.commit.subject}`));
        }
      }

      async function loadColumn(columnName) {
        const column = columns[columnName];
        const commit = normalizeCommit(column.commitInput.value);
        const branch = normalizeRef(column.input.value);
        const ref = commit || branch;
        const requestId = column.requestId + 1;
        column.requestId = requestId;
        column.files.clear();
        column.errors.clear();
        column.commit = null;
        column.commitError = "";
        column.refResolved = false;
        column.pinned = Boolean(commit);
        column.loading = Boolean(ref);

        renderRows();
        renderCommitMeta(columnName);

        if (!ref) {
          return;
        }

        const [commitResult, results] = await Promise.all([
          fetchProxyJson("commit", { ref })
            .then((data) => ({ commit: data.commit }))
            .catch((error) => ({ error })),
          fetchAllFiles(ref),
        ]);
        if (requestId !== column.requestId) {
          return;
        }

        column.loading = false;
        if (commitResult.commit) {
          column.commit = commitResult.commit;
          column.refResolved = true;
        } else {
          column.commitError = friendlyLoadError(commitResult.error, {
            pinned: column.pinned,
            ref,
          });
        }

        for (const { file, result } of results) {
          if (result.status === "fulfilled") {
            column.files.set(result.value.module, result.value);
          } else if (column.refResolved) {
            // Per-file failures only; a bad ref is reported once, in the meta
            // line, rather than repeated in every row.
            column.errors.set(
              file.module,
              friendlyLoadError(result.reason, {
                pinned: column.pinned,
                refResolved: true,
                ref,
              })
            );
          }
        }

        renderRows();
        renderCommitMeta(columnName);

        // Populate the picker ahead of the first click, but only once the ref
        // resolved, so partially typed branch names do not trigger lookups.
        if (
          branch &&
          column.refResolved &&
          column.commitListBranch !== branch
        ) {
          updateCommitSuggestions(columnName);
        }
      }

      function debounce(callback, waitMs) {
        let timeoutId;
        return () => {
          window.clearTimeout(timeoutId);
          timeoutId = window.setTimeout(callback, waitMs);
        };
      }

      function invalidateCommitSuggestions(column) {
        column.commitSuggestionRequestId += 1;
        column.commitListBranch = null;
        column.commitList.innerHTML = "";
      }

      for (const columnName of ["left", "right"]) {
        const column = columns[columnName];
        const onBranchSettled = debounce(() => {
          updateBranchSuggestions(column.input);
          loadColumn(columnName);
        }, 400);

        column.input.addEventListener("input", () => {
          invalidateCommitSuggestions(column);
          onBranchSettled();
        });
        column.commitInput.addEventListener(
          "input",
          debounce(() => loadColumn(columnName), 400)
        );
        column.commitInput.addEventListener("focus", () => {
          if (column.commitListBranch !== normalizeRef(column.input.value)) {
            updateCommitSuggestions(columnName);
          }
        });
      }

      loadColumn("left");
    </script>
  </body>
</html>
